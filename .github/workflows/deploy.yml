name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # permite disparar o deploy manualmente pela aba Actions
  workflow_dispatch:

# permissoes exigidas pelo deploy nativo de Pages (sem branch gh-pages)
permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; pushes em sequencia nao brigam pelo mesmo ambiente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # build tambem gera o dist/404.html (fallback de SPA do Pages)
      - run: npm run build

      # enablement: liga o Pages (source = GitHub Actions) na primeira execucao. Sem isso o
      # passo falha com "Get Pages site failed" ate alguem habilitar a mao em Settings > Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
